<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ti de">
<title id="ti">RevFlowLab data path: acquisition, services, product</title>
<desc id="de">Three stacked layers connected by vertical edges. Layer one, acquisition: a five tier escalation ladder from tls-impersonate through stealth headless, residential proxy and headful human simulation to maximum evasion, driven by learned per-domain tier prediction. Layer two, services: four Dockerized Python services named hunter, serp, warming and critique-agent, built on FastAPI, Docker and Supabase. Layer three, product: the revflowlab Next.js and TypeScript application with row level security multi-tenancy, 352 API routes, 225 migrations and 4667 tests.</desc>
<style>
:root{--fg:#1f2328;--muted:#656d76;--line:#d0d7de;--accent:#b8622f;--accent-dim:#b8622f33}
@media (prefers-color-scheme:dark){:root{--fg:#e6edf3;--muted:#8b949e;--line:#30363d;--accent:#e8944f;--accent-dim:#e8944f33}}
text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-size:9.5px;fill:var(--muted)}
.hd{font-size:10.5px;letter-spacing:1.1px}
.fg{fill:var(--fg)}
.an{font-size:8px;letter-spacing:.2px}
.tg{font-size:8px;letter-spacing:.6px}
.cl{font-size:9.5px;fill:var(--fg)}
.sv{font-size:11px;fill:var(--fg);text-anchor:middle}
.bg{font-size:16px;fill:var(--fg);letter-spacing:.4px}
.nm{font-size:14px;fill:var(--accent)}
.lb{font-size:8px;letter-spacing:.3px}
.e,.bx,.rg{fill:none;stroke:var(--line);stroke-width:1}
.mk{fill:var(--accent)}
.rg{animation:rg 12s ease-in-out infinite}
.r2{animation-delay:.4s}.r3{animation-delay:.8s}.r4{animation-delay:1.2s}.r5{animation-delay:1.6s}
.dt{fill:var(--accent);animation:pl 12s linear infinite}
.p2{animation-delay:-8s}.p3{animation-delay:-4s}
@keyframes rg{0%,100%{stroke:var(--line);fill:transparent}4%{stroke:var(--accent);fill:var(--accent-dim)}13%{stroke:var(--line);fill:transparent}}
@keyframes pl{0%{transform:translateY(0);opacity:1}22%{transform:translateY(46px);opacity:1}27%{transform:translateY(46px);opacity:0}99%{transform:translateY(0);opacity:0}100%{transform:translateY(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.rg,.dt{animation:none}}
</style>

<text x="40" y="52" class="hd">01<tspan class="fg" dx="9">ACQUISITION</tspan></text>
<text x="40" y="66" class="an">learned per-domain</text>
<text x="40" y="77" class="an">tier prediction</text>

<rect class="rg" x="190.5" y="58.5" width="124" height="32" rx="2"/>
<rect class="rg r2" x="326.5" y="54.5" width="124" height="36" rx="2"/>
<rect class="rg r3" x="462.5" y="50.5" width="124" height="40" rx="2"/>
<rect class="rg r4" x="598.5" y="46.5" width="124" height="44" rx="2"/>
<rect class="rg r5" x="734.5" y="42.5" width="124" height="48" rx="2"/>

<text x="202" y="72" class="tg">L1</text><text x="202" y="84" class="cl">tls-impersonate</text>
<text x="338" y="72" class="tg">L2</text><text x="338" y="84" class="cl">stealth headless</text>
